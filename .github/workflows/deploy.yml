name: Deploy (v4 Beta)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mcp-server-cloud/**'
      - 'site/**'
      - 'supabase/**'
      - 'scripts/deploy.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-commander-production
  cancel-in-progress: false

jobs:
  # What this push touched, and whether the site deploy is configured. Site-only
  # pushes do not redeploy MCP; MCP-only pushes do not redeploy the site; the
  # site job skips (not fails) until the Vercel secrets exist. Secret values are
  # only tested for presence, never printed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      mcp: ${{ steps.paths.outputs.mcp }}
      site: ${{ steps.paths.outputs.site }}
      site_ready: ${{ steps.vercel.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Changed paths
        id: paths
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "mcp=true" >> "$GITHUB_OUTPUT"; echo "site=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$AFTER")
          shared='^(\.github/workflows/deploy\.yml)$'
          if echo "$files" | grep -Eq '^(apps/mcp-server-cloud/|supabase/|scripts/deploy\.sh$)' || echo "$files" | grep -Eq "$shared"; then mcp=true; else mcp=false; fi
          if echo "$files" | grep -Eq '^site/' || echo "$files" | grep -Eq "$shared"; then site=true; else site=false; fi
          echo "mcp=$mcp" >> "$GITHUB_OUTPUT"; echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "changed: mcp=$mcp site=$site"
      - name: Vercel target configured?
        id: vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ] && [ -n "$VERCEL_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Site deploy skipped: VERCEL_ORG_ID / VERCEL_PROJECT_ID / VERCEL_TOKEN are not set."
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Install deps
        run: npm ci --prefer-offline --no-audit
      - name: Full test suite
        run: |
          npm test
          node bin/kc.js --test
          bash tests/smoke.sh
      - name: Registry drift
        run: node scripts/build-from-registry.js --check

  deploy-mcp:
    needs: [test, changes]
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy MCP cloud (canary)
        working-directory: apps/mcp-server-cloud
        run: flyctl deploy --strategy canary --app commander-mcp --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Wait for healthcheck
        run: |
          for i in {1..30}; do
            if curl -fsS --max-time 2 https://mcp.commanderplugin.com/health; then exit 0; fi
            sleep 2
          done
          exit 1

  deploy-site:
    needs: [test, changes]
    if: needs.changes.outputs.site == 'true' && needs.changes.outputs.site_ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - name: Require explicit Vercel production target
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_ORG_ID:?Set the verified Vercel organization ID before deploying this site}"
          : "${VERCEL_PROJECT_ID:?Set the verified Vercel project ID before deploying this site}"
          : "${VERCEL_TOKEN:?Set the Vercel deployment token}"
      - name: Install site deps
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Deploy to Vercel
        working-directory: site
        run: |
          npx --yes vercel@56.2.1 pull --yes --environment=production
          npx --yes vercel@56.2.1 build --prod
          npx --yes vercel@56.2.1 deploy --prebuilt --prod
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  post-deploy-smoke:
    needs: [deploy-mcp, deploy-site]
    # Runs when something deployed and nothing failed (a skipped job is fine).
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.deploy-mcp.result == 'success' || needs.deploy-site.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Site probe
        run: curl -fsS --max-time 5 https://commanderplugin.com > /dev/null
      - name: MCP health probe
        run: curl -fsS --max-time 5 https://mcp.commanderplugin.com/health > /dev/null
