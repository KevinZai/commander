name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege (CC-2068 G7): npm publish is gone, so no id-token or packages scope.
# Only the release job writes (contents: write, to create the GitHub release).
permissions:
  contents: read

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to full commit SHAs (CC-2068 G5); the comment names the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # npm ci installs exactly the lockfile the gate was tested with (CC-2068 G6).
      - name: Install dependencies
        run: npm ci

      # One gate list for the tag, prepublishOnly and RELEASE-CHECKLIST.md (CC-2068 G2/G3/G4/G9):
      # tag == package.json == top CHANGELOG entry, every check script, lint at the single
      # ceiling in package.json, Codex mirror drift, test:ci, smoke and the full npm test suite.
      # plugin validate needs the claude CLI, which this runner does not have: it is logged as
      # SKIP here and run locally per RELEASE-CHECKLIST.md.
      - name: Release gate
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-gate.js --tag "$TAG"

  release:
    name: GitHub release (npm publish disabled — CC Commander no-npm-publish policy)
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job only reads CHANGELOG.md and calls gh, so it installs no dependencies.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          fetch-depth: 0

      - name: Determine dist-tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # npm publish intentionally removed — CC Commander is distributed via the
      # Claude Code plugin marketplace + GitHub, not npm (no-npm-publish policy).

      - name: Extract CHANGELOG entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version between first two ## headers
          BODY=$(awk "/^## \[?${VERSION//./\\.}\]?/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="See CHANGELOG.md for details."
          fi
          # GitHub Actions multiline output
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BODY: ${{ steps.changelog.outputs.body }}
          PRERELEASE: ${{ steps.tag.outputs.dist_tag == 'beta' }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping creation."
            exit 0
          fi
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$BODY" \
            $PRERELEASE_FLAG
