# Single production deploy path for the MCP cloud app (Fly.io) and the site
# (Vercel). deploy-mcp.yml was removed so one change cannot deploy twice under
# two different gates. Order: release gate + MCP verify -> deploy (production
# environment, canary) -> post-deploy smoke.
name: Deploy (v4 Beta)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mcp-server-cloud/**'
      # Inputs the image bakes into data/ (scripts/bundle-catalog.mjs): a release that changes only a skill
      # body, a plugin agent or the registry must rebuild the hosted catalog.
      - 'skills/**'
      - 'commander/cowork-plugin/skills/**'
      - 'commander/cowork-plugin/agents/**'
      - 'commander/core/registry.yaml'
      - 'site/**'
      - 'supabase/**'
      - 'scripts/deploy.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-commander-production
  cancel-in-progress: false

jobs:
  # What this push touched, and whether the site deploy is configured. Site-only
  # pushes do not redeploy MCP; MCP-only pushes do not redeploy the site; the
  # site job skips (not fails) until the Vercel secrets exist. Secret values are
  # only tested for presence, never printed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      mcp: ${{ steps.paths.outputs.mcp }}
      site: ${{ steps.paths.outputs.site }}
      site_ready: ${{ steps.vercel.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: Changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Non-push events (workflow_dispatch) and undiffable pushes (new ref,
          # zero/missing base, base not in history) deploy everything (CC-1365).
          if [ "$EVENT" != push ] || [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "mcp=true" >> "$GITHUB_OUTPUT"; echo "site=true" >> "$GITHUB_OUTPUT"
            echo "changed: undiffable or non-push event -> mcp=true site=true"; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$AFTER")
          shared='^(\.github/workflows/deploy\.yml)$'
          # Site-only pushes must not redeploy the MCP app (CC-1365); MCP paths are
          # the union of #203 and c3bcc409 (apps/mcp-server-cloud/ is in both).
          # The baked catalog's inputs (skill bodies, plugin agents, registry) also redeploy MCP.
          if echo "$files" | grep -Eq '^(apps/mcp-server-cloud/|supabase/|scripts/deploy\.sh$|skills/|commander/cowork-plugin/(skills|agents)/|commander/core/registry\.yaml$)' || echo "$files" | grep -Eq "$shared"; then mcp=true; else mcp=false; fi
          if echo "$files" | grep -Eq '^site/' || echo "$files" | grep -Eq "$shared"; then site=true; else site=false; fi
          echo "mcp=$mcp" >> "$GITHUB_OUTPUT"; echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "changed: mcp=$mcp site=$site"
      - name: Vercel target configured?
        id: vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ] && [ -n "$VERCEL_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Site deploy skipped: VERCEL_ORG_ID / VERCEL_PROJECT_ID / VERCEL_TOKEN are not set."
          fi

  # The same release gate list the tag workflow and prepublishOnly run
  # (scripts/release-gate.js): version parity, contract, counts, registry drift,
  # lint, Codex mirror drift, test:ci, smoke and the full suite.
  test:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24' }
      - name: Install deps
        run: npm ci --prefer-offline --no-audit
      - name: Release gate
        run: node scripts/release-gate.js

  # Typecheck, tests and build of the MCP cloud app itself.
  mcp-verify:
    name: MCP cloud build, typecheck, test
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-server-cloud
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mcp-server-cloud/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Smoke script syntax
        run: bash -n scripts/smoke-test.sh
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  deploy-mcp:
    needs: [test, changes, mcp-verify]
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master as of 2026-11-18 (latest tag 1.6 predates it)
      # The image bundles the skill and agent catalog from data/ (gitignored); the Dockerfile fails without it.
      - name: Bundle catalog
        run: node apps/mcp-server-cloud/scripts/bundle-catalog.mjs
      - name: Deploy MCP cloud (canary)
        working-directory: apps/mcp-server-cloud
        run: flyctl deploy --strategy canary --app commander-mcp --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Wait for healthcheck
        run: |
          for i in {1..30}; do
            if curl -fsS --max-time 2 https://mcp.commanderplugin.com/health; then exit 0; fi
            sleep 2
          done
          exit 1

  deploy-site:
    needs: [test, changes]
    if: needs.changes.outputs.site == 'true' && needs.changes.outputs.site_ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24' }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - name: Require explicit Vercel production target
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_ORG_ID:?Set the verified Vercel organization ID before deploying this site}"
          : "${VERCEL_PROJECT_ID:?Set the verified Vercel project ID before deploying this site}"
          : "${VERCEL_TOKEN:?Set the Vercel deployment token}"
      - name: Install site deps
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Deploy to Vercel
        working-directory: site
        run: |
          npx --yes vercel@56.2.1 pull --yes --environment=production
          npx --yes vercel@56.2.1 build --prod
          npx --yes vercel@56.2.1 deploy --prebuilt --prod
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  post-deploy-smoke:
    needs: [deploy-mcp, deploy-site]
    # Runs when something deployed and nothing failed (a skipped job is fine).
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.deploy-mcp.result == 'success' || needs.deploy-site.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      # Retry to ride out a Fly machine swap right after a canary deploy
      # (seen on #211: one 5s timeout, healthy again ~10s later). 6 tries x 10s.
      - name: Site probe
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 5 https://commanderplugin.com > /dev/null; then exit 0; fi
            echo "site probe attempt $i failed; retrying in 10s"; sleep 10
          done
          exit 1
      - name: MCP health probe
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 5 https://mcp.commanderplugin.com/health > /dev/null; then exit 0; fi
            echo "MCP health attempt $i failed; retrying in 10s"; sleep 10
          done
          exit 1
