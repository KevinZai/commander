schema_version: "1.1"
name: ccc-fable
description: Commander Method (/ccc-fable) status reports the gate state and uses current model names.
tags: [skill:ccc-fable, fable]
execution:
  prompt: What is the current Commander Method (/ccc-fable) status in CC Commander? Just the status, do not change anything.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep, AskUserQuestion]
graders:
  - type: tool_used
    name: fable-skill-invoked
    tool: Skill
    input_match: '"skill":\s*"(commander:)?ccc-fable"'
  - type: regex
    name: reports-fable-state
    pattern: 'fable'
    flags: i
  - type: regex
    name: no-stale-model-names
    pattern: 'claude-(fable|opus|sonnet)-5([^-.0-9]|[-.]([^0-9]|$)|$)|claude-haiku-4-5|Haiku 4[.]5|\b(Opus|Fable|Sonnet) 5([^-.0-9]|[-.]([^0-9]|$)|$)|gpt-5[.]6|GPT-5[.]6'
    match: not_contains
