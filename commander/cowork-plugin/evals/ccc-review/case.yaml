schema_version: "1.1"
name: ccc-review
description: The review flow routes a pre-PR review request and reports on the branch diff (an empty sandbox repo has no diff).
tags: [skill:ccc-review, review, flagship]
execution:
  prompt: Review my current branch with CC Commander before I open a pull request.
  max_turns: 15
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, AskUserQuestion, Bash(git:*)]
graders:
  - type: tool_used
    name: review-skill-invoked
    tool: Skill
    input_match: '"skill":\s*"(commander:)?ccc-review"'
  - type: regex
    name: talks-about-diff-or-findings
    pattern: 'diff|finding|branch|no changes|nothing to review|commit'
    flags: i
  - type: regex
    name: no-fake-approval
    pattern: 'LGTM|looks good to merge|approved for merge'
    flags: i
    match: not_contains
  - type: llm
    name: verdicts-not-vibes
    criteria: |
      Pass if the reply either states plainly that there is no diff to review (and suggests the whole-project x-ray or naming a path), or reports findings that each carry a path:line anchor and a CONFIRMED or PLAUSIBLE verdict, plus the report path under tasks/reviews/. Fail if it approves the change, invents findings without anchors, or claims a report was written without naming its path.
