name: Deploy (v4 Beta)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mcp-server-cloud/**'
      - 'site/**'
      - 'supabase/**'
      - 'scripts/deploy.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-commander-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Install deps
        run: npm ci --prefer-offline --no-audit
      - name: Full test suite
        run: |
          npm test
          node bin/kc.js --test
          bash tests/smoke.sh
      - name: Registry drift
        run: node scripts/build-from-registry.js --check

  # Site-only pushes must not redeploy the MCP app. Push diffs decide; a
  # manual dispatch or an undiffable push (new ref, missing base) deploys.
  changes:
    runs-on: ubuntu-latest
    outputs:
      mcp: ${{ steps.diff.outputs.mcp }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          mcp=true
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BEFORE" "$SHA" | grep -q '^apps/mcp-server-cloud/'; then
              mcp=false
            fi
          fi
          echo "mcp=$mcp" >> "$GITHUB_OUTPUT"
          echo "MCP deploy: $mcp"

  deploy-mcp:
    needs: [test, changes]
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy MCP cloud (canary)
        working-directory: apps/mcp-server-cloud
        run: flyctl deploy --strategy canary --app commander-mcp --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Wait for healthcheck
        run: |
          for i in {1..30}; do
            if curl -fsS --max-time 2 https://mcp.commanderplugin.com/health; then exit 0; fi
            sleep 2
          done
          exit 1

  deploy-site:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - name: Require explicit Vercel production target
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_ORG_ID:?Set the verified Vercel organization ID before deploying this site}"
          : "${VERCEL_PROJECT_ID:?Set the verified Vercel project ID before deploying this site}"
          : "${VERCEL_TOKEN:?Set the Vercel deployment token}"
      - name: Install site deps
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Deploy to Vercel
        working-directory: site
        run: |
          npx --yes vercel@56.2.1 pull --yes --environment=production
          npx --yes vercel@56.2.1 build --prod
          npx --yes vercel@56.2.1 deploy --prebuilt --prod
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  post-deploy-smoke:
    needs: [deploy-mcp, deploy-site]
    runs-on: ubuntu-latest
    steps:
      - name: Site probe
        run: curl -fsS --max-time 5 https://commanderplugin.com > /dev/null
      - name: MCP health probe
        run: curl -fsS --max-time 5 https://mcp.commanderplugin.com/health > /dev/null
