name: Refresh Stats

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:     # Allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Refresh stats
        run: node scripts/refresh-stats.mjs
        env:
          POSTHOG_PERSONAL_KEY: ${{ secrets.POSTHOG_PERSONAL_KEY }}

      # Stats are published to the dedicated `stats` branch, never to main: the
      # daily refresh must not add automatic commits to the release branch.
      - name: Publish stats to the stats branch
        run: |
          set -euo pipefail
          cp docs/stats.json "$RUNNER_TEMP/stats.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin stats >/dev/null 2>&1; then
            git fetch --depth=1 origin stats
            git checkout -B stats FETCH_HEAD
          else
            git checkout --orphan stats
            git rm -rf --quiet .
          fi
          mkdir -p docs
          cp "$RUNNER_TEMP/stats.json" docs/stats.json
          git add docs/stats.json
          if git diff --cached --quiet; then
            echo "stats unchanged"
            exit 0
          fi
          git commit -m "chore(stats): refresh aggregate telemetry [auto]"
          git push origin stats
